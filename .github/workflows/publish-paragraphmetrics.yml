name: Publish verified paragraph metrics prerelease

on:
  push:
    branches: [publish/paragraphmetrics-144.1.2]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'xuanhun/skia-python'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          repository: xuanhun/skia-python
          run-id: 40327169088
          github-token: ${{ github.token }}
          pattern: paragraphmetrics-cp313-*-x64
          path: artifacts

      - name: Verify exact previously tested wheels and prepare release files
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import shutil

          expected = {
              "Windows": ("win_amd64", "4b4a0289a669efece619ad6135f905bb55a62d6bf797e184c4cc991471a60bd2"),
              "Linux": ("manylinux_2_28_x86_64", "472947ec327a80bde2a5821fea0454faa386ce77f9e2627705beaed96c61d125"),
          }
          source = "65de78ad59a940dd718d750fe4565686143445d9"
          skia = "2708a1b1540e59b8e3407405b0c991a5c7b69523"
          dist = Path("dist")
          dist.mkdir()
          wheels = []
          for os_name, (tag, expected_sha) in expected.items():
              root = Path("artifacts") / f"paragraphmetrics-cp313-{os_name}-x64"
              provenance = json.loads((root / "wheel-provenance.json").read_text(encoding="utf-8"))
              assert provenance["sourceCommit"] == source
              assert provenance["skiaCommit"] == skia
              name = f"skia_python-144.1+paragraphmetrics.2-cp313-cp313-{tag}.whl"
              wheel = root / "wheelhouse" / name
              sha = hashlib.sha256(wheel.read_bytes()).hexdigest()
              assert sha == expected_sha, f"Unexpected wheel digest: {name}"
              assert len(provenance["wheels"]) == 1
              assert provenance["wheels"][0]["sha256"] == sha
              shutil.copy2(wheel, dist / name)
              shutil.copy2(root / "wheel-provenance.json", dist / f"wheel-provenance-{os_name.lower()}-x64.json")
              wheels.append({"fileName": name, "sha256": sha, "bytes": wheel.stat().st_size})
          manifest = {
              "version": "144.1+paragraphmetrics.2", "sourceCommit": source, "skiaCommit": skia,
              "buildRun": "https://github.com/xuanhun/skia-python/actions/runs/40327169088",
              "upstreamPullRequest": "https://github.com/skia-python/skia-python/pull/394",
              "wheels": wheels,
              "validation": "Each target: 49 native tests passed, 2 deselected in CI and local installed-wheel rerun; 56 affected project regression tests passed locally.",
              "limitations": ["Temporary fork prerelease; CPython 3.13 x64 only.",
                              "No complete P1/P3, original JS raster or Office/WPS equivalence claim.",
                              "Linux requires host fontconfig/OpenGL/libEGL and appropriate fonts."]}
          (dist / "release-provenance.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          fingerprints = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in sorted(dist.iterdir())]
          (dist / "SHA256SUMS").write_text("\n".join(fingerprints) + "\n", encoding="utf-8")
          notes = """Temporary fork prerelease exposing existing native SkParagraph inspection bindings.

          - Upstream Draft PR: https://github.com/skia-python/skia-python/pull/394
          - Exact build source: 65de78ad59a940dd718d750fe4565686143445d9
          - Build: https://github.com/xuanhun/skia-python/actions/runs/40327169088
          - Supported artifacts: CPython 3.13, Windows x64 and Linux glibc x86_64.
          - Each target passed 49 binding/paragraph tests (2 explicitly deselected) in CI and an installed-wheel local rerun; 56 affected project regression tests also passed per target.
          - Source/final font PNGs were compared within each OS. Different OS fonts are not claimed pixel-equivalent.
          - The project Python Canvas consumer is not yet equivalent to public skia-canvas 3.0.8: 13-case exact comparisons retain 27 field / 4541 pixel differences on Windows, 27 field / 5233 pixel differences on Linux. No tolerance or compensation was applied.

          No Skia shaping/layout/painting algorithms were changed. This does not certify a complete PPT workflow or Office/WPS compatibility. No PyPI publication is performed. See SHA256SUMS and provenance JSONs for verification.
          """
          Path("release-notes.md").write_text(notes, encoding="utf-8")

      - name: Publish prerelease with tested assets only
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create 'v144.1+paragraphmetrics.2' dist/*
          --repo xuanhun/skia-python
          --target 65de78ad59a940dd718d750fe4565686143445d9
          --title 'skia-python 144.1+paragraphmetrics.2 (temporary fork)'
          --notes-file release-notes.md
          --prerelease --latest=false
